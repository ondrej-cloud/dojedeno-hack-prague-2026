  <script type="application/json" class="poznamky-data">["Oponentura · záložní slajd po závěru", "Tohle je návrh pilotní sestavy pro naše tři pásy. Talíře se vyfotí cestou, ještě před vysypáním. Kbelík stojí zvlášť na váze.", "[mezerník] Kamery: chceme zachytit talíře automaticky bez zastavování. Záběr pro každé patro, umístění a potřebný počet kamer musíme ověřit v jídelně; model je schéma, nikoli hotová instalace.", "[mezerník] Váha: skutečná hmotnost pochází z přírůstku váhy kbelíku. Jeden talíř může být vyškrábnutý vícekrát a více talířů může skončit v jedné dávce.", "[mezerník] AI rozpozná zbytky a navrhne přiřazení fotek k přírůstkům podle času, pořadí a odhadu z fotografie. Nejde o jisté pořadí napříč třemi pásy. Při souběhu nebo nejistotě necháme společnou dávku, případně hmotnost bez přiřazení k talíři.", "Bez zastavování talířů je cíl návrhu. Průchodnost, zakrývání talířů a správnost přiřazení ověříme v pilotu. Odhad z fotky nesmí nahradit naměřenou hmotnost. Současné živé demo váží talíř přímo; párování pásů s váhou kbelíku ještě není implementované.", "Zdroje: vlastní návrh pilotní sestavy a párování událostí. Model nepředstavuje ověřenou přesnost ani potvrzené finální vybavení."]</script>
