  <script type="application/json" class="poznamky-data">["0:00–0:25 · Ondra", "Šipka doprava nebo mezerník spustí asi 13 s film, mluví titulky: jeden oběd v reflektoru (0–4 s), kamera odjede na celou jídelnu (4–8 s), jídlo z každého třetího talíře odletí do kbelíku a počítadlo doběhne na 31 % (8–13 s). Po skončení filmu se koš automaticky přesune do titulní kompozice s 3D sestavou.", "Přes film klidně a pomalu, s pauzami: Tohle je jeden školní oběd. (pauza) Jídelna jich denně vydá stovky. (pauza, jídlo letí) A téměř třetina z toho, co se uvaří, skončí v koši.", "[automaticky po filmu, mezerník přeskočí] Tma se prolne do světla: vlevo Dojedeno, Vážíme to vážně. a 31 %, vpravo se točí 3D model naší sestavy (myší jde natočit).", "Jednatřicet procent. Jsme Dojedeno a chceme, aby každá jídelna věděla, co a kolik vyhazuje. Každý den, automaticky.", "Asi 50 slov. Mezerník během filmu přeskočí rovnou na titul. Návrat šipkou úplně na začátek úvod přetočí a zastaví; další šipka doprava ho znovu spustí. Bez WebGL se místo filmu ukáže 2D gastronádoba, text je stejný.", "Zdroje: Prague Food Waste 2024 (Zachraň jídlo, Mendelova univerzita, INESAN, GREEN Solution): zbytky z talířů a nevydané pokrmy = 31 % hmotnosti uvařeného, bez odpadu z přípravy. Stovky obědů denně: jídelny ve výzkumu vařily pro 400–600 žáků."]</script>
