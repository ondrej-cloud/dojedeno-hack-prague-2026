<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>3D test</title>
<style>html,body{margin:0;height:100%;background:#f5f5f7;font-family:-apple-system,sans-serif} #m{position:absolute;left:80px;top:180px;width:1100px;height:820px;background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.06)}</style></head>
<body><div id="m" data-model3d></div>
<script src="../js/model3d.js"></script>
<script>
const el=document.getElementById('m');
function jdi(){const k=+(location.hash.slice(1)||0);el.__m3d&&el.__m3d.krok(k,true);}
addEventListener('hashchange',jdi); jdi();
addEventListener('keydown',e=>{if(e.key>='0'&&e.key<='3'){el.__m3d.krok(+e.key,false);}});
</script></body></html>
